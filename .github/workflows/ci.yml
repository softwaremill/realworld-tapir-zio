name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v3
      - name: Setup JDK
        id: setup-jdk
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: 'sbt'
      - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1, specifically v1.5.10
      - name: Check formatting
        id: check-formatting
        run: sbt scalafmtCheckAll
      - name: Test
        id: test
        run: sbt -v testFull
      - name: Postman tests
        id: postman-tests
        run: ./run-postman-tests.sh
        shell: bash